name: Backend CI

on:
  # Ручний запуск кнопкою на вкладці Actions — не залежить від paths-фільтра
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Building the solution covers all three projects (Api, Core, Worker) - the worker stays
      # compilable under CI without a separate workflow.
      - run: dotnet restore KnowledgeBase.sln

      - run: dotnet build KnowledgeBase.sln -c Release --no-restore
