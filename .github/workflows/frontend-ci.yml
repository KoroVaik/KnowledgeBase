name: Frontend CI

on:
  # Ручний запуск кнопкою на вкладці Actions — не залежить від paths-фільтра
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

# Новий пуш у ту саму гілку скасовує попередній запуск
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, а не install: ставить рівно те, що в package-lock.json, і падає,
      # якщо lock розійшовся з package.json
      - run: npm ci

      - run: npm run lint

      # tsc -b && vite build — компіляція типів входить у цей крок
      - run: npm run build
