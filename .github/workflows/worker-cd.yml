name: Worker CD

# Deploys on every push to main, whether committed directly or merged from a PR (a PR
# merge is also a push, so the two triggers must not be combined — it would deploy twice).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/KnowledgeBase.Core/**'
      - 'backend/KnowledgeBase.Worker/**'
      - 'infra/worker/**'
      - '.github/workflows/worker-cd.yml'

permissions:
  contents: read

# A deploy is never cancelled halfway; a newer push waits and then ships on top.
concurrency:
  group: worker-cd
  cancel-in-progress: false

jobs:
  deploy:
    # The self-hosted runner on the home PC (infra/worker/README.md). Matching on the
    # default label only: the repo is private and has exactly one runner, so a custom
    # label would add a re-registration step without narrowing anything.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5

      # up --build builds first and recreates the container only after a successful build,
      # so a broken build leaves the running worker untouched.
      - name: Rebuild and restart the worker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WORKER_ENV_FILE) {
              throw "WORKER_ENV_FILE is not set in the runner's .env - see infra/worker/README.md"
          }
          docker compose -f infra/worker/docker-compose.yml up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image prune -f
