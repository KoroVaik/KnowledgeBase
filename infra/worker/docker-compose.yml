name: knowledgebase-worker

services:
  worker:
    build:
      context: ../../backend
      dockerfile: KnowledgeBase.Worker/Dockerfile
    image: knowledgebase-worker:local
    container_name: knowledgebase-worker
    restart: unless-stopped
    # Neon + R2 credentials. Copy worker.env.example -> worker.env and fill in.
    env_file:
      - worker.env
    environment:
      # Docker Desktop routes host.docker.internal to host loopback services, so this
      # reaches a native Ollama bound to 127.0.0.1 with no host-side change.
      Ai__Ollama__BaseUrl: http://host.docker.internal:11434
    # A no-op on Docker Desktop (host.docker.internal is built in); needed on native Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
