services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: knowledgebase-garage
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # The S3 API is open to the LAN: the browser PUTs into the bucket itself, so a phone
      # on the same network has to reach it. Writing still needs a signed URL.
      - "3900:3900"
      # The admin API has no such need - only this host talks to it.
      - "127.0.0.1:3903:3903"

volumes:
  garage-meta:
  garage-data:
