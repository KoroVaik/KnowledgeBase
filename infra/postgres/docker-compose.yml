services:
  postgres:
    image: postgres:17-alpine
    container_name: knowledgebase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgebase
      POSTGRES_USER: knowledgebase
      POSTGRES_PASSWORD: knowledgebase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: this is a development database, it has no business being reachable
      # from the network. Credentials are fixed and throwaway for the same reason.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgebase -d knowledgebase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
